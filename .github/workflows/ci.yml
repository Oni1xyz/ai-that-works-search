name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check scripts src tests
      - name: Security scan
        run: uv run bandit -q -lll -r scripts src
      - name: Test
        run: uv run pytest -q tests
      - name: Compile
        run: uv run python -m compileall -q scripts src

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and smoke-test image
        run: |
          docker build --tag ai-that-works-search:ci .
          docker tag ai-that-works-search:ci ai-that-works-search:local
          docker run --rm ai-that-works-search:ci --help
          mkdir -p index .cache/huggingface
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm rag --help
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm \
            --entrypoint .venv/bin/python -e PYTHONPATH=/app/src build-index -c \
            "from pathlib import Path; import json; from aitw_search.build_index import create_staging_directory, publish_index; output=Path('index'); staging=create_staging_directory(output); (staging/'metadata.json').write_text(json.dumps({'created_at':'2026-01-01T00:00:00+00:00','embeddings_sha256':'0'*64})); publish_index(staging, output)"
          test -f index/CURRENT
