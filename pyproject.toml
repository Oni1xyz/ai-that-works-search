[project]
name = "ai-that-works-search"
version = "0.1.0"
description = "Local semantic search across AI That Works transcripts, notes, and diagrams"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.35",
  "numpy>=2.0",
  "sentence-transformers>=5.1",
  "youtube-transcript-api>=1.2",
]

[project.scripts]
aitw-search = "aitw_search.search:main"
aitw-build = "aitw_search.build_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitw_search"]
